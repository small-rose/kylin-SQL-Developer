name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: temurin
          cache: maven

      - name: Extract version from tag
        shell: bash
        run: |
          TAG=${GITHUB_REF_NAME#v}
          echo "RELEASE_VERSION=$TAG" >> $GITHUB_ENV

      - name: Update pom version
        run: mvn versions:set -DnewVersion=${{ env.RELEASE_VERSION }} -DgenerateBackupPoms=false

      - name: Build distribution
        run: mvn clean package -DskipTests -B

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Kylin SQL Developer ${{ env.RELEASE_VERSION }}
          tag_name: ${{ github.ref_name }}
          body_path: docs/CHANGELOG.md
          draft: true
          fail_on_unmatched_files: false
          files: |
            kylin-sql-assembly/target/kylin-sql-*.zip
            kylin-sql-assembly/target/kylin-sql-*.tar.gz
